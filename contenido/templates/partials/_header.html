<header class="header">
    <a href="{% url 'home' %}" class="logo">"Aprende Jugando"</a>
    <nav class="nav-menu">
        <a href="{% url "home" %}" class="nav-item {% if request.resolver_match.url_name == 'home' %}active{% endif %}">Inicio</a>
        <a href="" class="nav-item {% if request.resolver_match.url_name == 'catalog' %}active{% endif %}">Catálogo</a>
        <a href="{% url "Blog" %}" class="nav-item {% if request.resolver_match.url_name == 'blog' %}active{% endif %}">Blog</a>
        <a href="{% url "acerca" %}" class="nav-item {% if request.resolver_match.url_name == 'about' %}active{% endif %}">Nosotros</a>
    </nav>
    <div class="user-actions">
        {% if user.is_authenticated %}
            <a href="" class="nav-item" style="position: relative; padding: 10px 15px;">
                🛒
                <span style="position: absolute; top: -5px; right: 0; background: #667eea; color: white; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 12px;">
                    {{ cart_items_count }}
                </span>
            </a>
            <a href="#" class="btn btn-primary" style="display: flex; align-items: center; gap: 8px;">
                <span>👤</span>
                <span>Bienvenido, {{ user.username }}</span>
            </a>
            <a href="{% url 'logout' %}" class="btn btn-secondary" style="margin-left: 10px;">
                Cerrar sesión
            </a>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-secondary {% if request.resolver_match.url_name == 'login' %}active{% endif %}">Ingresar</a>
            <a href="{% url 'registro' %}" class="btn btn-primary {% if request.resolver_match.url_name == 'registro' %}active{% endif %}">Registrarse</a>
        {% endif %}
    </div>
</header>
