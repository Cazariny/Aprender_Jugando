{% extends 'base.html' %}
{% load static %}

{% block title %}Editar Perfil - Aprende Jugando{% endblock %}

{% block content %}
<section class="form-section">
    <div class="form-container">
        <h1 style="margin-bottom: 10px; text-align: center;">Editar Perfil</h1>
        
        {% if messages %}
            <ul style="color: green;">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
                <div class="form-group">
                    <label class="form-label" for="first_name">Nombre</label>
                    <input type="text" id="first_name" name="first_name" class="form-input" value="{{ request.user.first_name }}" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="last_name">Apellido</label>
                    <input type="text" id="last_name" name="last_name" class="form-input" value="{{ request.user.last_name }}" required>
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label class="form-label" for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="form-input" value="{{ request.user.email }}" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 15px; font-size: 18px; margin-top: 20px;">
                Guardar Cambios
            </button>
        </form>
    </div>
</section>
{% endblock %}
